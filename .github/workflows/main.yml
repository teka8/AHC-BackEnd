name: Deploy Laravel App via FTP

on:
  push:
    branches:
      - main  # or your deploy branch

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, bcmath, intl, pdo, mysql
        tools: composer

    - name: Install Composer dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: Generate optimized autoload files
      run: composer dump-autoload -o

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Clean node_modules and package-lock
      run: |
        rm -rf node_modules package-lock.json

    - name: Install NPM dependencies
      run: npm install --include=optional

    - name: Build assets
      run: npm run build

    - name: Create storage link
      run: |
        # Create storage link
        php artisan storage:link

    - name: Upload files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftp
        server-dir: /
        local-dir: ./  # Upload everything from repo root
        exclude: |
          **/.git*
          **/node_modules/**
          **/tests/**
          **/.github/**
          **/storage/**
          .env
          .env.*

    - name: Run Migrations on Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ${{ secrets.SSH_APP_PATH }}
          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          echo "Migration completed successfully"
